<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scrapstar — SPAZ-style space combat</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; cursor: none; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #c9a24a; font: bold 14px sans-serif; letter-spacing: 3px; background: #0b0703; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="boot">GENERATING SECTOR…</div>
<script>
'use strict';
// =====================================================================
//  Scrapstar — a top-down space combat game in the spirit of
//  Space Pirates and Zombies. Everything (art, sound) is generated in code.
// =====================================================================

// ---------- config / test hooks ----------
const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');
const SCENARIO = QS.get('scenario') || '';
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
if (TEST) Math.random = mulberry(20110101);

// ---------- math utils ----------
const TAU = Math.PI * 2;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rgb = (c, a) => a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const shade = (c, k) => [clamp(c[0] * k, 0, 255), clamp(c[1] * k, 0, 255), clamp(c[2] * k, 0, 255)];
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, oct = 5) {
  let t = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { t += a * vnoise(x * f, y * f, s + i * 31); n += a; f *= 2.02; a *= 0.5; }
  return t / n;
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; }

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, UI = 1, ZOOM = 1;
function resize() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  UI = clamp(Math.min(W / 1341, H / 997), 0.75, 1);
  ZOOM = clamp(H / 997, 0.6, 1.5) * 0.98;
}
addEventListener('resize', resize); resize();

// ---------- input ----------
const keys = {};
const mouse = { x: W / 2, y: H / 2, wx: 0, wy: 0, l: false, r: false };
addEventListener('keydown', e => {
  if (!keys[e.code]) onKeyPress(e.code);
  keys[e.code] = true;
  if (['Space', 'Tab', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  audioInit();
});
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('mousedown', e => { if (e.button === 0) mouse.l = true; if (e.button === 2) mouse.r = true; audioInit(); onClick(); });
addEventListener('mouseup', e => { if (e.button === 0) mouse.l = false; if (e.button === 2) mouse.r = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.l = mouse.r = false; });

// =====================================================================
//  ART GENERATION
// =====================================================================
const glowCache = new Map();
function glowSprite(c, hard = 0) {
  const key = c.join(',') + '|' + hard;
  let s = glowCache.get(key);
  if (s) return s;
  s = makeCanvas(64, 64); const g = s.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, rgb(mix(c, [255, 255, 255], hard ? 0.7 : 0.25), 1));
  gr.addColorStop(hard ? 0.18 : 0.12, rgb(c, 0.85));
  gr.addColorStop(0.45, rgb(c, 0.28));
  gr.addColorStop(1, rgb(c, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  glowCache.set(key, s); return s;
}
function glow(x, y, r, c, a = 1, hard = 0) {
  if (a <= 0.003 || r < 0.5) return;
  ctx.globalAlpha = a; ctx.drawImage(glowSprite(c, hard), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1;
}

// ----- ship sprite painter -----
// Designs are described with the nose pointing +x, in world units.
const SPR = 2; // sprite pixels per world unit
function polyPath(g, pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
function bbox(pts) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); } return { x0, y0, x1, y1 }; }
function rectPts(x, y, w, h, bev = 0) {
  const a = x - w / 2, b = y - h / 2, c = x + w / 2, d = y + h / 2, e = Math.min(bev, w / 3, h / 3);
  return e ? [[a + e, b], [c - e, b], [c, b + e], [c, d - e], [c - e, d], [a + e, d], [a, d - e], [a, b + e]] : [[a, b], [c, b], [c, d], [a, d]];
}
function paintMetal(g, pts, col, seed, o = {}) {
  const bb = bbox(pts), rr = mulberry(seed);
  g.save();
  polyPath(g, pts);
  // light comes from the upper-left of the sprite
  const mx = (bb.x0 + bb.x1) / 2, sw = (bb.x1 - bb.x0) * 0.18;
  const gr = g.createLinearGradient(mx + sw, bb.y0, mx - sw, bb.y1);
  gr.addColorStop(0, rgb(shade(col, 1.45))); gr.addColorStop(0.45, rgb(col)); gr.addColorStop(1, rgb(shade(col, 0.5)));
  g.fillStyle = gr; g.fill(); g.clip();
  const bw = bb.x1 - bb.x0, bh = bb.y1 - bb.y0;
  // plates
  const plates = o.plates ?? Math.ceil(bw * bh / 90);
  for (let i = 0; i < plates; i++) {
    const w = 3 + rr() * 16, h = 2 + rr() * 9, x = bb.x0 + rr() * bw - w / 2, y = bb.y0 + rr() * bh - h / 2;
    const v = rr();
    g.fillStyle = v < 0.45 ? `rgba(0,0,0,${0.05 + rr() * 0.08})` : v < 0.8 ? `rgba(255,255,255,${0.03 + rr() * 0.04})` : rgb(shade(col, 0.8 + rr() * 0.4), 0.35);
    g.fillRect(x, y, w, h);
    if (rr() < 0.35) { g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 0.35; g.strokeRect(x, y, w, h); }
  }
  // seams
  g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 0.45;
  for (let i = 0; i < (o.seams ?? Math.ceil(bw / 9)); i++) {
    const x = bb.x0 + rr() * bw; g.beginPath(); g.moveTo(x, bb.y0); g.lineTo(x + (rr() - 0.5) * 4, bb.y1); g.stroke();
  }
  // grime
  for (let i = 0; i < plates / 3; i++) {
    const x = bb.x0 + rr() * bw, y = bb.y0 + rr() * bh, r = 1 + rr() * 5;
    const gg = g.createRadialGradient(x, y, 0, x, y, r); gg.addColorStop(0, `rgba(20,14,8,${0.12 + rr() * 0.2})`); gg.addColorStop(1, 'rgba(20,14,8,0)');
    g.fillStyle = gg; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // greebles: vents, pipes, boxes, rivets and fine metal grain (pre-rendered 3D look)
  if (!o.plain) {
    const n = Math.ceil(bw * bh / 260);
    for (let i = 0; i < n; i++) {
      const x = bb.x0 + rr() * bw, y = bb.y0 + rr() * bh, t = rr();
      if (t < 0.3) { // vent grille
        const w = 4 + rr() * 7, h = 2.5 + rr() * 3; g.fillStyle = 'rgba(10,10,12,0.55)'; g.fillRect(x, y, w, h);
        g.fillStyle = 'rgba(255,255,255,0.12)'; for (let k = 0.8; k < w; k += 1.3) g.fillRect(x + k, y + 0.3, 0.4, h - 0.6);
      } else if (t < 0.5) { // pipe run
        const len = 6 + rr() * 16, hor = rr() < 0.7; g.lineCap = 'round';
        g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(x, y); hor ? g.lineTo(x + len, y) : g.lineTo(x, y + len); g.stroke();
        g.strokeStyle = 'rgba(255,255,255,0.22)'; g.lineWidth = 0.5; g.beginPath(); g.moveTo(x, y - 0.4); hor ? g.lineTo(x + len, y - 0.4) : g.lineTo(x - 0.4, y + len); g.stroke();
      } else if (t < 0.75) { // raised box
        const w = 2 + rr() * 6, h = 2 + rr() * 5; g.fillStyle = rgb(shade(col, 0.9 + rr() * 0.4)); g.fillRect(x, y, w, h);
        g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(x, y, w, 0.5); g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(x, y + h - 0.5, w, 0.5); g.fillRect(x + w - 0.4, y, 0.4, h);
      } else { // rivet row
        g.fillStyle = 'rgba(0,0,0,0.45)'; const len = 5 + rr() * 12; for (let k = 0; k < len; k += 1.8) g.fillRect(x + k, y, 0.55, 0.55);
      }
    }
    for (let i = 0; i < bw * bh / 6; i++) { g.fillStyle = rr() < 0.5 ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.05)'; g.fillRect(bb.x0 + rr() * bw, bb.y0 + rr() * bh, 0.5, 0.5); }

  polyPath(g, pts);
  g.lineWidth = 2.2; g.strokeStyle = 'rgba(0,0,0,0.35)'; g.stroke();
  g.translate(0.6, 0.6); polyPath(g, pts); g.translate(-0.6, -0.6);
  g.lineWidth = 1.1; g.strokeStyle = 'rgba(255,255,255,0.2)';
  g.save(); g.translate(0, -0.9); polyPath(g, pts); g.restore(); g.stroke();
  g.restore();
  polyPath(g, pts); g.lineWidth = 0.7; g.strokeStyle = 'rgba(8,6,4,0.95)'; g.stroke();
}
function paintStripe(g, pts, col) {
  polyPath(g, pts);
  const bb = bbox(pts), gr = g.createLinearGradient(bb.x0, bb.y0, bb.x1, bb.y1);
  gr.addColorStop(0, rgb(shade(col, 1.3))); gr.addColorStop(1, rgb(shade(col, 0.6)));
  g.fillStyle = gr; g.fill(); g.lineWidth = 0.4; g.strokeStyle = 'rgba(0,0,0,0.6)'; g.stroke();
}
function paintNozzle(g, x, y, w, h) {
  paintMetal(g, rectPts(x, y, w, h, 1.2), [70, 70, 74], 5, { plates: 2, seams: 0 });
  g.fillStyle = '#0b0a0a'; g.beginPath(); g.ellipse(x - w / 2 + 0.6, y, 1.4, h * 0.36, 0, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.2)'; g.lineWidth = 0.4;
  for (let i = 1; i < 3; i++) { g.beginPath(); g.moveTo(x - w / 2 + i * w / 3, y - h / 2); g.lineTo(x - w / 2 + i * w / 3, y + h / 2); g.stroke(); }
}
function paintWindows(g, x0, y0, x1, y1, n, col) {
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0.5 : i / (n - 1), x = lerp(x0, x1, t), y = lerp(y0, y1, t);
    g.fillStyle = rgb(col); g.fillRect(x - 0.8, y - 0.6, 1.6, 1.2);
  }
}
// Build a sprite from a part list. Each part: {k:'hull'|'box'|'stripe'|'noz'|'win'|'dish', ...}
function buildSprite(design) {
  const L = design.len, Wd = design.wid, pad = 10;
  const cw = (L + pad * 2) * SPR, ch = (Wd + pad * 2) * SPR;
  const c = makeCanvas(cw, ch), g = c.getContext('2d');
  g.translate(cw / 2, ch / 2); g.scale(SPR, SPR);
  let seed = design.seed || 1;
  const each = (p, fn) => { fn(p, 1); if (p.m) fn(p, -1); };
  for (const p of design.parts) {
    each(p, (p, s) => {
      seed++;
      const col = p.c || design.col;
      if (p.k === 'hull') paintMetal(g, p.pts.map(([x, y]) => [x, y * s]), col, seed, p);
      else if (p.k === 'box') paintMetal(g, rectPts(p.x, p.y * s, p.w, p.h, p.b ?? 1.5), col, seed, p);
      else if (p.k === 'stripe') paintStripe(g, p.pts.map(([x, y]) => [x, y * s]), p.c || design.acc);
      else if (p.k === 'noz') paintNozzle(g, p.x, p.y * s, p.w, p.h);
      else if (p.k === 'grime') { const gr = g.createRadialGradient(p.x, p.y * s, 0, p.x, p.y * s, Math.max(p.rx, p.ry)); gr.addColorStop(0, rgb(p.c, 0.4)); gr.addColorStop(1, rgb(p.c, 0)); g.save(); g.translate(p.x, p.y * s); g.scale(1, p.ry / p.rx); g.translate(-p.x, -p.y * s); g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y * s, p.rx, 0, TAU); g.fill(); g.restore(); }

      else if (p.k === 'dish') {

        const gr = g.createRadialGradient(p.x - p.r * 0.4, p.y * s - p.r * 0.4, 0, p.x, p.y * s, p.r);
        gr.addColorStop(0, rgb(shade(col, 1.6))); gr.addColorStop(1, rgb(shade(col, 0.45)));
        g.fillStyle = gr; g.fill(); g.lineWidth = 0.6; g.strokeStyle = '#080604'; g.stroke();

  return { canvas: c, cw, ch };
}
// wrecked hulk: take a design, darken, punch holes
function buildHulk(design, seed) {
  const s = buildSprite(design), g = s.canvas.getContext('2d'), r = mulberry(seed);
  g.save(); g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 18; i++) {
    const x = r() * s.cw, y = r() < 0.5 ? r() * s.ch * 0.25 : s.ch - r() * s.ch * 0.25, rad = 6 + r() * 26;

const SPRITES = {};

// ----- nebula backdrop: single-hue amber, billowy clouds, no black void -----
let NEB = null, STARS = null, HULK_BG = null;
const NEB_PAL = [[40, 27, 8], [62, 42, 12], [78, 51, 15], [96, 64, 17], [116, 78, 20], [140, 94, 22], [170, 112, 30], [205, 140, 40]];
function genNebula() {
  const w = 640, h = 480;
  const c = makeCanvas(w, h), g = c.getContext('2d'), id = g.createImageData(w, h), d = id.data;
  const mauve = [110, 90, 80];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const u = x / w * 4, v = y / h * 3;
    const q = fbm(u * 0.8, v * 0.8, 11, 4);
    const wu = u + 1.4 * q, wv = v + 1.4 * q;
    // billow noise (abs of signed noise) gives the puffy cauliflower look
    let b = 0, a = 0.5, f = 1, n = 0;
    for (let i = 0; i < 4; i++) { b += a * (1 - Math.abs(vnoise(wu * f * 1.6, wv * f * 1.6, 70 + i * 13) * 2 - 1)); n += a; a *= 0.52; f *= 2.05; }

    let t = clamp((b - 0.35) * 1.25 + (big - 0.5) * 1.5, 0, 1);
    t = Math.pow(t, 1.15);
    const k = NEB_PAL.length - 1, fi = t * k, i0 = Math.min(k - 1, fi | 0);
    let col = mix(NEB_PAL[i0], NEB_PAL[i0 + 1], fi - i0).map(v => v * 1.12);
    col = mix(col, [175, 115, 30], sstep(0.6, 0.85, big) * 0.55);
    // brighter glow toward the upper area and the sun, as in the reference
    col = mix(col, [190, 130, 45], clamp(0.35 - v / 3 * 0.5, 0, 0.35) * 0.6);
    const wisp = sstep(0.6, 0.8, fbm(u * 1.3 + 9, v * 1.3 + 4, 41, 5)) * 0.12;
    col = mix(col, mauve, wisp);
    const j = (y * w + x) * 4;
    d[j] = col[0]; d[j + 1] = col[1]; d[j + 2] = col[2]; d[j + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  const cs = makeCanvas(w, h), gs = cs.getContext('2d'); gs.filter = 'blur(2.5px)'; gs.drawImage(c, 0, 0);
  NEB = cs;
}
function genStars() {
  const c = makeCanvas(1024, 1024), g = c.getContext('2d'), r = mulberry(99);
  for (let i = 0; i < 22; i++) {
    const x = r() * 1024, y = r() * 1024, s = 0.8 + r() * 1.6;
    const gr = g.createRadialGradient(x, y, 0, x, y, s * 3); gr.addColorStop(0, `rgba(245,228,180,${0.35 + r() * 0.4})`); gr.addColorStop(1, 'rgba(245,228,180,0)');
    g.fillStyle = gr; g.fillRect(x - s * 3, y - s * 3, s * 6, s * 6);
  }
  STARS = c;
}
// ----- sun: golden, mottled cellular surface, soft glowing edge, curved corona filaments -----
let SUN_SPR = null, SUN_RAYS = null;
function genSun() {
  const S = 360, R = 90, c = makeCanvas(S, S), g = c.getContext('2d');
  const id = g.createImageData(S, S), d = id.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = (x - S / 2) / R, dy = (y - S / 2) / R, rr = Math.sqrt(dx * dx + dy * dy);
    if (rr > 1.06) continue;
    const mu = Math.sqrt(Math.max(0, 1 - rr * rr));
    let col = mix([245, 185, 70], [255, 245, 150], clamp(mu * 1.4, 0, 1));
    // cellular mottling: ridged noise makes dark lanes between bright cells
    const cell = (1 - Math.abs(fbm(dx * 3.4 + 4, dy * 3.4 + 1, 83, 4) * 2 - 1)) * 0.65 + (1 - Math.abs(fbm(dx * 7 + 2, dy * 7 - 3, 89, 3) * 2 - 1)) * 0.35;
    const spots = sstep(0.62, 0.85, cell) * (1 - sstep(0.7, 0.95, rr)) * (0.55 + 0.45 * sstep(0.4, -0.4, dy));
    const gran = (fbm(dx * 6, dy * 6, 71, 3) - 0.5) * 0.35;
    col = mix(col, [170, 100, 35], clamp(spots * 0.75 + gran * 0.35, 0, 0.7));

  for (let i = n; i >= 0; i--) { const a = lerp(a0, a1, i / n); o.push([Math.cos(a) * r0, Math.sin(a) * r0]); }
  return o;

  const b = document.getElementById('boot'); if (b) b.remove();
}
let last = 0, acc = 0;
const STEP = 1 / 60;
function frame(ts) {
  const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts;
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  if (beamHum && AC) beamHum.gain.setTargetAtTime(player && player.beamActive && !tactics ? 0.05 : 0, AC.currentTime, 0.03);
  render();
  requestAnimationFrame(frame);
}
boot();
if (TEST) {
  window.__game = {
    ready: true,
    step(n) { for (let i = 0; i < n; i++) update(STEP); },
    render() { render(); },
    stats() { return { ships: ships.length, hostiles: ships.filter(s => s.fac === FAC.UTA || s.fac === FAC.ZOMBIE).length, rez: res.rez | 0, cargo: res.cargo | 0, data: res.data, wave, player: player && { cls: player.cls, hull: player.hull | 0, shield: player.shield | 0, armor: player.armor.map(a => a | 0) }, fleet: fleet.map(f => f ? f.cls : null), critters: critters.length }; },
  };
  if (SCENARIO === 'play') requestAnimationFrame(frame);
} else requestAnimationFrame(frame);
</script>
